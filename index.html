const THR={granate:0,alch:'p',cage:'c',flash:'f',molo:'m'};
function throwG(u,a,v,k,d,pl){G.push({x:u.x,y:u.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:u.t,l:.45,d,pl,k,o:u})}
function fireBoom(u,a,pl){BM.push({x:u.x,y:u.y,vx:Math.cos(a)*540,vy:Math.sin(a)*540,t:u.t,o:u,pl,l:0,hit:[],ph:0})}
function fireBeam(u,a,pl){const x2=u.x+Math.cos(a)*6000,y2=u.y+Math.sin(a)*6000;X.push({x:u.x,y:u.y,x2,y2,l:.35,beam:1});for(const e of U){if(e.t===u.t||e.hp<=0||e.sh>0)continue;const dx=x2-u.x,dy=y2-u.y,k=clamp(((e.x-u.x)*dx+(e.y-u.y)*dy)/(dx*dx+dy*dy),0,1);if(Math.hypot(e.x-(u.x+dx*k),e.y-(u.y+dy*k))<30)hurt(e,pl?160:90,pl,u)}}
function useShield(ang,pw){const u=U[0];if(state!=='play'||!u||u.hp<=0||u.zm||u.sc>0||u.cg>0)return;const a=ang===undefined?u.a:ang,id=AB[asel].id;
 if(mode==='ctf'&&(id==='sprung'||id==='schild'))return;
 if(id in THR){if(inBase(u))return;throwG(u,a,(pw===undefined?300:pw*520)/.348,THR[id],id==='granate'?150:id==='molo'?30:0,1)}
 else if(id==='schild')u.sh=2.5;
 else if(id==='sprung')dash(u,ang===undefined?(Math.hypot(u.mx||0,u.my||0)>.2?Math.atan2(u.my,u.mx):u.a):a);
 else if(id==='rage'){u.rg=5;X.push({x:u.x,y:u.y,l:.4,c:'255,120,40'})}
 else if(id==='boom'){if(inBase(u))return;fireBoom(u,a,1)}
 else if(id==='beam'){if(inBase(u))return;fireBeam(u,a,1)}
 else heal(u);
 u.sc=mode==='apo'?1.5:AB[asel].cd}
function botAbil(u,tg,bd){if(u.zm)return;if(u.ac>0||inBase(u)||u.cg>0)return;const id=u.ab,fr=U.filter(e=>e.t===u.t&&e.hp>0&&Math.hypot(e.x-u.x,e.y-u.y)<500);let ok=false;
 if(mode==='ctf'&&(id==='sprung'||id==='schild'))return;
 if(id==='schild')ok=tg&&bd<400&&u.hp<u.mh*.75;else if(id==='rage')ok=tg&&bd<320;else if(id==='heal')ok=fr.filter(e=>e.hp<e.mh*.6).length>=2||u.hp<u.mh*.4;
 else if(id==='sprung')ok=(tg&&bd>260)||(!tg&&Math.random()<.02);else if(id==='alch')ok=tg&&fr.length>=3;
 else if(id==='boom')ok=tg&&bd<420;else if(id==='beam')ok=tg&&bd<900&&bd>150;else if(id==='cage')ok=tg&&bd>150&&bd<350;else if(id==='flash')ok=tg&&bd>120&&bd<350;
 else ok=tg&&bd>(mode==='apo'?90:140)&&bd<(mode==='apo'?420:340);
 if(!ok)return;u.ac=(mode==='apo'||mode==='one')?2+Math.random()*2:AB.find(a=>a.id===id).cd*.6+2+Math.random()*3;
 const a=tg?Math.atan2(tg.y-u.y,tg.x-u.x):u.a;
 if(id==='schild')u.sh=2.5;else if(id==='rage')u.rg=5;else if(id==='heal')heal(u);else if(id==='sprung')dash(u,u.a);
 else if(id==='boom')fireBoom(u,a,0);else if(id==='beam')fireBeam(u,a,0);
 else throwG(u,a,(id==='alch'?80:bd)/.348,THR[id],id==='granate'?70:id==='molo'?20:0,0)}
function ringPos(u){const R=Math.min(WW,WH)*.38;for(let k=0;k<14;k++){u.x=WW/2+Math.cos(u.sa0)*R+(k?(Math.random()-.5)*90:0);u.y=WH/2+Math.sin(u.sa0)*R+(k?(Math.random()-.5)*90:0);if(!blocked(u.x,u.y,12))break}}
function spawnAt(u){if(!SP.length){ringPos(u);return}const pool=[{x:SP[u.t][0],y:SP[u.t][1],r:150}].concat(cps.filter(c=>c.o===u.t&&!U.some(e=>e.hp>0&&e.t!==u.t&&Math.hypot(e.x-c.x,e.y-c.y)<300)).map(c=>({x:c.x,y:c.y,r:50})));if(mode==='ctf'){const sx=WW/2+(u.t?1:-1)*(RW+280);pool.push({x:sx,y:WH*.12,r:70},{x:sx,y:WH*.88,r:70})}const b=pool[Math.floor(Math.random()*pool.length)];
 for(let k=0;k<20;k++){u.x=b.x+(Math.random()-.5)*2*b.r;u.y=b.y+(Math.random()-.5)*2*b.r;if(!blocked(u.x,u.y,12))break}}

const te=e=>{for(const t of e.changedTouches){const lg=ht&&t.identifier===ht.id&&Date.now()-ht.t>350&&!ht.mv;

addEventListener('keydown',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=true;if(e.key==='q'||e.key==='Q')placeClone();const dg=e.key.length===1&&e.key>='1'&&e.key<='9';if(dg&&(state==='menu'||state==='shop'||(state==='play'&&U[0].hp<=0&&mode!=='gamble'))){wsel=+e.key-1;lock()}if(e.key==='Shift'||e.key==='e'||e.key==='E')useShield();if(e.key==='Escape'&&state==='shop'){state='menu';shopY=0}if(e.key==='Enter'||e.key===' '){if(state==='menu')init();else if(state==='end'&&Date.now()-endAt>800){state='menu';shopY=0}}});
